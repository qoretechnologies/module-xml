stages:
  - test
  - verify

default:
  tags:
    - k8s
    - amd64
  before_script:
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${STATUS_CONTEXT}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e

variables:
  REPO_NAME: module-xml
  # the GitHub status context a job reports
  STATUS_CONTEXT: module-xml
  # the number of parallel jobs running the Python WSDL/SOAP suite; must match "parallel" below
  PYTHON_SHARDS: "6"

# runs $TEST_SCRIPT with $TEST_MODE and reports the result to GitHub under $STATUS_CONTEXT
.report: &report
  script:
    - |
        if ${TEST_SCRIPT} ${TEST_MODE}; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${STATUS_CONTEXT}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${STATUS_CONTEXT}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi

# one shard of the Python suite; the verify job of the same distribution reports the combined result
.python-shard: &python-shard
  stage: test
  parallel: 6
  before_script: []
  script:
    - ${TEST_SCRIPT} python-shard
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - test/wsdl-interop/ci-results/

.python-verify: &python-verify
  <<: *report
  stage: verify
  when: always
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - test/wsdl-interop/ci-results/

test-ubuntu:
  <<: *report
  stage: test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  variables:
    TEST_SCRIPT: test/docker_test/test-ubuntu.sh
    TEST_MODE: qtest

test-alpine:
  <<: *report
  stage: test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  variables:
    TEST_SCRIPT: test/docker_test/test-alpine.sh
    TEST_MODE: qtest

python-ubuntu:
  <<: *python-shard
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  variables:
    TEST_SCRIPT: test/docker_test/test-ubuntu.sh

python-alpine:
  <<: *python-shard
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  variables:
    TEST_SCRIPT: test/docker_test/test-alpine.sh

python-verify-ubuntu:
  <<: *python-verify
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  needs:
    - job: python-ubuntu
      artifacts: true
  variables:
    TEST_SCRIPT: test/docker_test/test-ubuntu.sh
    TEST_MODE: python-verify
    STATUS_CONTEXT: module-xml-python-ubuntu

python-verify-alpine:
  <<: *python-verify
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  needs:
    - job: python-alpine
      artifacts: true
  variables:
    TEST_SCRIPT: test/docker_test/test-alpine.sh
    TEST_MODE: python-verify
    STATUS_CONTEXT: module-xml-python-alpine
