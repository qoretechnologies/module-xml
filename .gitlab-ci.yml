# CI resources are limited, and a module-xml test pipeline (Qore tests from source and AOT-compiled, a valgrind job
# and twelve Python suite shards on Ubuntu and Alpine) is resource intensive. The tests run in a child pipeline
# (.gitlab/ci/module-xml.yml) started by one trigger job holding a project-wide resource group, which it keeps until
# the child pipeline completes, so that the test pipelines of all branches, including dependency update branches, run
# one at a time and wait in order. Auto-cancel is disabled: cancelling a redundant pipeline cancels only its trigger
# job, which releases the lock while the child pipeline keeps running, so a newer pipeline would run concurrently. A
# superseded pipeline therefore runs when its turn comes; to skip one, cancel it before it starts, or cancel its child
# pipeline together with it.

workflow:
  auto_cancel:
    on_new_commit: none

stages:
  - test

# A develop commit whose tree already passed CI (a merged pull request that was up to date with develop) is not tested
# again: tree-already-tested.sh finds the pipeline that passed the tree, the trigger job passes its ID to the child
# pipeline, and every job there sources tree-tested-skip.sh first, which then ends the job with success.  Without such
# a pipeline, or when the pipelines cannot be read, the whole pipeline runs.  The same job runs in qore's pipelines.
tree-already-tested:
  stage: .pre
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  variables:
    GIT_DEPTH: "3"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - sh test/docker_test/tree-already-tested.sh
  artifacts:
    reports:
      dotenv: tree-tested.env

module-xml:
  stage: test
  resource_group: module-xml-ci
  needs: [{job: tree-already-tested, optional: true}]
  # the dotenv variables of tree-already-tested, for tree-tested-skip.sh in the child pipeline's jobs
  variables:
    QORE_TREE_TESTED_IN: $QORE_TREE_TESTED_IN
    QORE_TREE_TESTED_SHA: $QORE_TREE_TESTED_SHA
  trigger:
    include: .gitlab/ci/module-xml.yml
    strategy: depend
