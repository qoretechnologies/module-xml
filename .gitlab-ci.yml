# CI resources are limited, and a module-xml test pipeline (Qore tests and twelve Python suite shards on Ubuntu and
# Alpine) is resource intensive. The tests run in a child pipeline (.gitlab/ci/module-xml.yml) started by one trigger
# job holding a project-wide resource group, which it keeps until the child pipeline completes, so that the test
# pipelines of all branches, including dependency update branches, run one at a time and wait in order.
# Auto-cancel is disabled: cancelling a redundant pipeline cancels only its trigger job, which releases the lock while
# the child pipeline keeps running, so a newer pipeline would run concurrently. A superseded pipeline therefore runs
# when its turn comes; to skip one, cancel it before it starts, or cancel its child pipeline together with it.

workflow:
  auto_cancel:
    on_new_commit: none

stages:
  - test

module-xml:
  stage: test
  resource_group: module-xml-ci
  trigger:
    include: .gitlab/ci/module-xml.yml
    strategy: depend
