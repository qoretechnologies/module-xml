<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c98f4d"/>
      <stop offset="100%" stop-color="#8a5a2b"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="#0f1f33"/>

  <!-- shipping container body -->
  <g transform="translate(28,72)">
    <rect x="0" y="0" width="200" height="120" fill="url(#boxGrad)" stroke="#4a2e15" stroke-width="3" rx="3"/>
    <!-- corrugation lines -->
    <g stroke="#4a2e15" stroke-width="1.5" opacity="0.45">
      <line x1="20" y1="0" x2="20" y2="120"/>
      <line x1="40" y1="0" x2="40" y2="120"/>
      <line x1="60" y1="0" x2="60" y2="120"/>
      <line x1="80" y1="0" x2="80" y2="120"/>
      <line x1="100" y1="0" x2="100" y2="120"/>
      <line x1="120" y1="0" x2="120" y2="120"/>
      <line x1="140" y1="0" x2="140" y2="120"/>
      <line x1="160" y1="0" x2="160" y2="120"/>
      <line x1="180" y1="0" x2="180" y2="120"/>
    </g>
    <!-- corner reinforcement -->
    <rect x="0" y="0" width="14" height="120" fill="none" stroke="#3a2410" stroke-width="3"/>
    <rect x="186" y="0" width="14" height="120" fill="none" stroke="#3a2410" stroke-width="3"/>
  </g>

  <!-- XML angle brackets, large and centered -->
  <g fill="#f5e9d3" font-family="Menlo, Consolas, monospace" font-weight="700" font-size="64" text-anchor="middle">
    <text x="128" y="154" letter-spacing="-2">&lt;/&gt;</text>
  </g>

  <!-- forklift forks at the bottom suggesting cargo handling -->
  <g fill="#f5b431">
    <rect x="36" y="200" width="60" height="8" rx="2"/>
    <rect x="160" y="200" width="60" height="8" rx="2"/>
  </g>
</svg>
